<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }
        .logo {
            max-width: 150px;
        }
        .content {
            padding: 20px 0;
            color: #333333;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            margin: 20px 0;
            background-color: #007bff;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .otp {
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
        }
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #eaeaea;
            font-size: 12px;
            color: #777777;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header with logo -->
    <div class="header">
        <img src="https://i.ibb.co/WmYmBfn/image.png" alt="FSM Logo" class="logo"/>
    </div>

    <!-- Content -->
    <div class="content">
        <p>Hello <span th:text="${user}"></span>,</p>
        <p>You requested to reset your password. Please click the button below:</p>

        <p style="text-align: center;">
            <a th:href="${link}" class="button">Reset Password</a>
        </p>

        <p>If the button above doesn’t work, copy and paste this link into your browser:</p>
        <p><span th:text="${link}"></span></p>

        <p>Thanks,<br/><span th:text="${sign}"></span></p>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>If you didn’t request a password reset, you can ignore this email.</p>
        <p>Need help? Contact us at
            <a th:href="'mailto:' + ${SUPPORT_EMAIL}" th:text="${SUPPORT_EMAIL}"></a>
        </p>
    </div>
</div>
</body>
</html>
