server:
  port: 8085
  error:
    include-stacktrace: never

spring:
  application:
    name: technician-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect



  datasource:
      url: jdbc:mysql://localhost:3306/fsm-technician
      username: root
      password: octal#321
      driver-class-name: com.mysql.cj.jdbc.Driver
      initialize: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  fetch-registry: true
  instance:
    prefer-ip-address: true
#    instance-id: ${EUREKA_INSTANCE_IP}:${spring.application.name}:${server.port}
#    ip-address: ${EUREKA_INSTANCE_IP:${spring.cloud.client.ip-address}}




springdoc:
  api-docs.path : /api-docs
  swagger-ui.path : /swagger-ui.html

