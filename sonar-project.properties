# SonarQube project configuration
sonar.projectKey=fmp-technician-service
sonar.projectName=FMP Technician Service
sonar.projectVersion=0.0.1-SNAPSHOT

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Language
sonar.language=java
sonar.java.source=11

# Encoding
sonar.sourceEncoding=UTF-8

# Test and coverage reports
sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions - files/directories to exclude from analysis
sonar.exclusions=\
    **/target/**,\
    **/*.xml,\
    **/*.yml,\
    **/*.yaml,\
    **/*Application.java,\
    **/dto/**,\
    **/entities/**,\
    **/models/**,\
    **/constants/**,\
    **/configuration/OpenApiConfig.java

# Test exclusions
sonar.test.exclusions=\
    **/src/test/**

# Coverage exclusions - files to exclude from coverage calculation
sonar.coverage.exclusions=\
    **/*Application.java,\
    **/dto/**,\
    **/entities/**,\
    **/models/**,\
    **/constants/**,\
    **/configuration/**,\
    **/exceptions/**

# Duplication exclusions
sonar.cpd.exclusions=\
    **/dto/**,\
    **/entities/**,\
    **/models/**

# Quality gate conditions
sonar.qualitygate.wait=true

# Additional rules
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.libraries=target/dependency/*.jar